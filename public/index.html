<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Together - Lista Compartida</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Music Together</h1>
            <p>Lista de reproducción compartida</p>
        </header>

        <div class="add-song-section">
            <div class="input-group">
                <input type="text" id="userName" placeholder="Tu nombre (opcional)" maxlength="20">
                <input type="url" id="youtubeUrl" placeholder="Pega aquí el enlace de YouTube">
                <button id="addSongBtn">Añadir</button>
            </div>
        </div>

        <div class="player-section">
            <div id="player-container">
                <div id="youtube-player"></div>
            </div>
            <div class="player-controls">
                <div id="current-song-info">
                    <span id="no-song">No hay canciones en reproducción</span>
                </div>
                <button id="nextSongBtn" style="display: none;">Siguiente Canción</button>
            </div>
        </div>

        <div class="playlist-section">
            <h3>Cola de Reproducción (<span id="queue-count">0</span>)</h3>
            <div id="playlist" class="playlist">
                <p class="empty-playlist">La lista está vacía. ¡Añade la primera canción!</p>
            </div>
        </div>

        <div class="status">
            <span id="connection-status">🔴 Desconectado</span>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js"></script>
</body>
</html>
