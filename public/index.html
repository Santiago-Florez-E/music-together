<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Together - Premium Shared Playlist</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🎵 Music Together</h1>
        <p>Sincroniza tu música con amigos en tiempo real</p>
      </header>

      <div class="app-layout">
        <!-- Main Content: Player and Tabs -->
        <main class="main-content">
          <section class="card player-section">
            <div id="player-container">
              <div id="youtube-player"></div>
            </div>
            <div class="player-controls">
              <div id="current-song-info">
                <span id="no-song">Nada sonando ahora mismo</span>
              </div>
              <button id="nextSongBtn" style="display: none">
                Siguiente →
              </button>
            </div>

            <div class="message-bar">
              <input
                type="text"
                id="screenMessage"
                placeholder="Escribe un mensaje para la pantalla..."
                maxlength="140"
              />
              <button id="sendMessageBtn">Enviar</button>
            </div>
          </section>

          <div class="tabs">
            <button class="tab-btn active" id="tabQueueBtn" data-tab="queue">Cola</button>
            <button class="tab-btn" id="tabSearchBtn" data-tab="search">Buscar</button>
            <button class="tab-btn" id="tabHistoryBtn" data-tab="history">Historial</button>
          </div>

          <div class="tab-panel" id="tab-queue">
            <section class="card add-song-section">
              <div class="input-group">
                <input
                  type="text"
                  id="userName"
                  placeholder="Tu nombre"
                  maxlength="20"
                />
                <input
                  type="url"
                  id="youtubeUrl"
                  placeholder="Pega un enlace de YouTube aquí..."
                />
                <button id="addSongBtn">Añadir a la cola</button>
              </div>
            </section>

            <section class="card playlist-section">
              <h3>
                Cola de Reproducción
                <span class="queue-badge" id="queue-count">0</span>
              </h3>
              <div id="playlist" class="playlist">
                <p class="empty-playlist">
                  La lista está vacía. ¡Añade la primera canción!
                </p>
              </div>
            </section>
          </div>

          <div class="tab-panel hidden" id="tab-search">
            <section class="card search-section">
              <div class="search-bar">
                <input
                  type="text"
                  id="searchQuery"
                  placeholder="Busca una canción o artista en YouTube..."
                />
                <button id="searchBtn">Buscar</button>
              </div>
              <div id="searchResults" class="search-results">
                <p class="empty-search">Escribe algo y pulsa Buscar</p>
              </div>
            </section>
          </div>

          <div class="tab-panel hidden" id="tab-history">
            <section class="card history-section">
              <h3 style="margin-bottom: 1rem">Historial (últimas 50)</h3>
              <div id="historyList" class="history-results">
                <p class="empty-search">Aún no hay historial</p>
              </div>
            </section>
          </div>
        </main>

        <!-- Sidebar: Recommended Songs -->
        <aside class="card sidebar">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 1.5rem;
            "
          >
            <h3 style="margin: 0">Sugerencias</h3>
            <button
              id="refreshSuggestions"
              style="
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
                background: rgba(255, 255, 255, 0.1);
              "
            >
              ↻ Refrescar
            </button>
          </div>
          <div id="recommendations" class="recommendation-list">
            <!-- Recommended items will be injected here -->
          </div>
        </aside>
      </div>
    </div>

    <div id="connection-status" class="connection-pill">⚪ Conectando...</div>

    <!-- Socket.io client -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- App Logic -->
    <script src="app.js"></script>
    <!-- YouTube IFrame Player API (Must be last) -->
    <script src="https://www.youtube.com/iframe_api"></script>
  </body>
</html>
